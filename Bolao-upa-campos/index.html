<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão GB Campos — Login</title>

<!-- ===== FAVICON + ÍCONE MOBILE (logo PNG) ===== -->
<link rel="icon" type="image/png" href="imagem/logo-192.png">
<link rel="apple-touch-icon" href="imagem/logo-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bolão UPA">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-container">
  <div class="login-card">
    <div class="login-header">

      <!-- ✅ LOGO SUBSTITUI O DADO -->
      <div class="login-logo">
        <img src="imagem/logo-192.png"
             alt="Bolão UPA Campos"
             onerror="this.outerHTML='<i class=\'fas fa-dice\'></i>'">
      </div>

      <h1>Bolão GB Campos</h1>
      <p>Bolões de loterias</p>
    </div>

    <form id="login-form" class="login-form">
      <div class="input-group">
        <label for="login-email"><i class="fas fa-envelope"></i> E-mail</label>
        <input type="email" id="login-email" class="input-control" required autocomplete="email" placeholder="seu@email.com">
      </div>

      <div class="input-group">
        <label for="login-senha"><i class="fas fa-lock"></i> Senha</label>
        <div class="password-wrapper">
          <input type="password" id="login-senha" class="input-control" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" id="toggle-senha" class="toggle-password" title="Mostrar senha">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div id="login-error" class="login-error" style="display:none;"></div>

      <button type="submit" id="btn-login" class="btn-primary btn-block">
        <i class="fas fa-sign-in-alt"></i> Entrar
      </button>
    </form>

    <div class="login-footer">
      <p><strong>UPA Campos dos Goytacazes</strong></p>
      <p class="version">Bolão v1.0.0</p>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<div id="global-loader" aria-hidden="true">
  <div class="loader"></div>
  <div class="loader-texto" id="loader-texto">Carregando...</div>
</div>

<script type="module" src="script_login.js"></script>
</body>
</html>
