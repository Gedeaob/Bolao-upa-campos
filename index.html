<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão UPA Campos — Login</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎲</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo"><i class="fas fa-dice"></i></div>
      <h1>Bolão UPA Campos</h1>
      <p>Bolões de loterias — Mega-Sena & Lotofácil</p>
    </div>

    <form id="login-form" class="login-form">
      <div class="input-group">
        <label for="login-email"><i class="fas fa-envelope"></i> E-mail</label>
        <input type="email" id="login-email" class="input-control" required autocomplete="email" placeholder="seu@email.com">
      </div>

      <div class="input-group">
        <label for="login-senha"><i class="fas fa-lock"></i> Senha</label>
        <div class="password-wrapper">
          <input type="password" id="login-senha" class="input-control" required autocomplete="current-password" placeholder="••••••••">
          <button type="button" id="toggle-senha" class="toggle-password" title="Mostrar senha">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div id="login-error" class="login-error" style="display:none;"></div>

      <button type="submit" id="btn-login" class="btn-primary btn-block">
        <i class="fas fa-sign-in-alt"></i> Entrar
      </button>

      <button type="button" id="btn-recuperar" class="btn-link">Esqueci minha senha</button>
    </form>

    <div class="login-footer">
      <p><strong>UPA Campos dos Goytacazes</strong></p>
      <p class="version">Bolão v1.0.0</p>
    </div>
  </div>
</div>

<div id="toast-container" class="toast-container"></div>

<div id="global-loader" aria-hidden="true">
  <div class="loader"></div>
  <div class="loader-texto" id="loader-texto">Carregando...</div>
</div>

<script type="module" src="script_login.js"></script>
</body>
</html>
